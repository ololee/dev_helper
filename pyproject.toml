[project]
name = "devhelper-desktop"
version = "2.9.0"
description = "DevHelper desktop and Android workspace over HTTP MCP"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "starlette>=0.40,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "imageio-ffmpeg>=0.6,<1",
  "Pillow>=10,<13",
  "zeroconf>=0.145,<1",
  "PyYAML>=6,<7",
  "pyobjc-framework-Cocoa>=11,<20; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay", "assetripper_cli"]
py-modules = ["server", "control", "clipboard", "devices", "knowledge", "resource_batches", "resource_workspace", "baidu_drive", "asset_library", "media", "audio", "sync", "private_skills", "web_assets", "workflows", "ai_support", "notifications", "relay_client", "spine", "minigames", "minigame_formats", "assetripper"]

[project.scripts]
devhelper-relay = "relay.server:main"
devhelper-minigames = "minigames:main"
devhelper-assetripper = "assetripper:main"
