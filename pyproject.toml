[project]
name = "devhelper-desktop"
version = "2.2.0"
description = "DevHelper desktop and Android workspace over HTTP MCP"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "starlette>=0.40,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "zeroconf>=0.145,<1",
  "PyYAML>=6,<7",
  "pyobjc-framework-Cocoa>=11,<20; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay"]
py-modules = ["server", "control", "clipboard", "devices", "knowledge", "sync", "private_skills", "web_assets", "workflows", "relay_client"]

[project.scripts]
devhelper-relay = "relay.server:main"
